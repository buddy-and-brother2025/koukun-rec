<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>こうくんの体調記録</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background-color: #2C5693;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: start;
      overflow-y: auto;
      padding: 20px 0;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      text-align: center;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      margin: 40px 0;
    }

    h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: 28px;
      letter-spacing: 4px;
      margin: 0;
      color: #2C5693;
      word-wrap: break-word;
      line-height: 1.2;
    }

    h2 {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-size: 14px;
      color: #333;
      text-align: left;
    }

    .input-group {
      width: 100%;
      margin-bottom: 20px;
    }

    select, input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #2C5693;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f9f9f9;
      color: #333;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #FFD700;
    }

    textarea {
      resize: vertical;
    }

    .submit-button {
      background-color: #2C5693;
      border: 2px solid #2C5693;
      color: white;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 20px;
      margin-top: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-button:hover {
      background-color: #FFD700;
      border-color: #FFD700;
      color: #2C5693;
    }

    .credit {
      font-size: 0.8rem;
      color: #2C5693;
      letter-spacing: 2px;
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>こうくんの体調記録</h1>
    <h2>体調を記録しよう</h2>

    <label>日付</label>
    <div class="input-group">
      <input type="date" id="date">
    </div>

    <label>体温（最高）</label>
    <div class="input-group">
      <input type="text" id="temp" placeholder="例: 39.2℃">
    </div>

    <label>発熱時間帯</label>
    <div class="input-group">
      <select id="feverTime">
        <option value="">選択</option>
        <option>朝</option>
        <option>昼</option>
        <option>夕方</option>
        <option>夜</option>
        <option>不明</option>
      </select>
    </div>

    <label>継続時間</label>
    <div class="input-group">
      <select id="duration">
        <option value="">選択</option>
        <option>数時間</option>
        <option>半日</option>
        <option>1日</option>
        <option>それ以上</option>
      </select>
    </div>

    <label>食欲</label>
    <div class="input-group">
      <select id="appetite">
        <option value="">選択</option>
        <option>普段通り</option>
        <option>やや少なめ</option>
        <option>ほとんどなし</option>
      </select>
    </div>

    <label>睡眠</label>
    <div class="input-group">
      <select id="sleep">
        <option value="">選択</option>
        <option>よく眠れた</option>
        <option>途中で起きた</option>
        <option>寝つき悪い</option>
      </select>
    </div>

    <label>排泄</label>
    <div class="input-group">
      <select id="excretion">
        <option value="">選択</option>
        <option>普段通り</option>
        <option>便がゆるい</option>
        <option>便秘気味</option>
        <option>おしっこが少ない</option>
      </select>
    </div>

    <label>咳・鼻水・喉</label>
    <div class="input-group">
      <input type="text" id="symptoms" placeholder="例: 鼻水あり、咳なし">
    </div>

    <label>機嫌</label>
    <div class="input-group">
      <select id="mood">
        <option value="">選択</option>
        <option>元気</option>
        <option>やや不機嫌</option>
        <option>ぐずる</option>
      </select>
    </div>

    <label>その他メモ</label>
    <div class="input-group">
      <textarea id="notes" rows="2" placeholder="気づいたことや医師のコメントなど"></textarea>
    </div>

    <button class="submit-button" onclick="submitToSheet()">SUBMIT</button>

    <div class="credit">Made by Buddy & Brother.</div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyFdealcsxpSEzBMDVMn8ETpdeVtP5hrDpeVzSDM9NU9apnGP_vfUCTW59vpPOzYbPv/exec';

    function submitToSheet() {
  // フォームの値をまとめてdataオブジェクトに格納
  const data = {
    date: document.getElementById('date').value,
    temp: document.getElementById('temp').value,
    feverTime: document.getElementById('feverTime').value,
    duration: document.getElementById('duration').value,
    appetite: document.getElementById('appetite').value,
    sleep: document.getElementById('sleep').value,
    excretion: document.getElementById('excretion').value,
    symptoms: document.getElementById('symptoms').value,
    mood: document.getElementById('mood').value,
    notes: document.getElementById('notes').value
  };

  const scriptURL = 'https://script.google.com/macros/s/AKfycbyFdealcsxpSEzBMDVMn8ETpdeVtP5hrDpeVzSDM9NU9apnGP_vfUCTW59vpPOzYbPv/exec';

  // データ送信
  fetch(scriptURL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(() => {
    alert('送信完了しました！');
    clearInputs();  // 入力フォームをクリア
  })
  .catch(error => {
    alert('送信に失敗しました。もう一度試してください。');
    console.error('送信エラー', error);
  });
}

   function clearInputs() {
  // IDを管理する配列
  const ids = ['date', 'temp', 'feverTime', 'duration', 'appetite', 'sleep', 'excretion', 'symptoms', 'mood', 'notes'];

  // 各IDに対して、要素が存在する場合に値をクリア
  ids.forEach(id => {
    const element = document.getElementById(id);
    if (element) { // 要素が見つかった場合のみ実行
      element.value = ''; // 入力内容をクリア
    }
  });
}

  </script>
</body>
</html>
